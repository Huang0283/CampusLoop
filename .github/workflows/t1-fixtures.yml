name: T1 fixture package

on:
  pull_request:
    paths:
      - tests/collaboration/phase-5/data-permissions/**
      - backend/app/schemas/**
      - services/m8_baseline/**
      - scripts/m8_phase2/**
      - openapi/campusloop.v1.yaml
      - .github/workflows/t1-fixtures.yml
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Check runner style
        run: |
          ruff check --config backend/ruff.toml tests/collaboration/phase-5/data-permissions
          ruff format --check --config backend/ruff.toml tests/collaboration/phase-5/data-permissions
      - name: Validate all fixture families and hashes
        run: python tests/collaboration/phase-5/data-permissions/verify_data.py
      - name: Check integrity failures and audit environment boundaries
        run: python -m unittest discover -s tests/collaboration/phase-5/data-permissions -p test_package.py -v
