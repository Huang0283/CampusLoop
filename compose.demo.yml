# Labeled synthetic data only. Start through scripts/start-demo.ps1.
name: campusloop-demo
services:
  db:
    environment:
      POSTGRES_DB: campusloop_demo
    ports: !override
      - '127.0.0.1:15442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusloop -d campusloop_demo']
  redis:
    ports: !override []
  minio:
    image: campusloop-local-minio:dev
    ports: !override
      - '127.0.0.1:19026:9000'
      - '127.0.0.1:19027:9001'
  minio-init:
    image: campusloop-local-minio:dev
  baseline:
    image: campusloop-demo-api:dev
  worker:
    image: campusloop-demo-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://campusloop:campusloop@db:5432/campusloop_demo
      REDIS_URL: redis://redis:6379/15
    ports: !override
      - '127.0.0.1:18027:8000'
  api:
    image: campusloop-demo-api:dev
    command: ['sh', '-c', 'alembic upgrade head && python scripts/seed_demo.py && python scripts/serve.py']
    environment:
      CAMPUSLOOP_DEMO_DATASET: campusloop-demo-v1
      DATABASE_URL: postgresql+psycopg://campusloop:campusloop@db:5432/campusloop_demo
      REDIS_URL: redis://redis:6379/15
      CORS_ORIGINS: http://127.0.0.1:5198
      AUTH_COOKIE_NAME: campusloop-demo-session
      S3_PUBLIC_BASE_URL: http://127.0.0.1:19026/campusloop-public
    ports: !override
      - '127.0.0.1:18026:8000'
volumes:
  db-data:
    name: campusloop-demo-db
  redis-data:
    name: campusloop-demo-redis
  minio-data:
    name: campusloop-demo-media
  baseline-data:
    name: campusloop-demo-baseline
