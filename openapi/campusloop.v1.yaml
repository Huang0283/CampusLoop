          required: [id, reviewerId, revieweeId, createdAt]
          properties:
            id: { type: integer, format: int64 }
            reviewerId: { type: integer, format: int64 }
            revieweeId: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
    ReportTargetType: { type: string, enum: [USER, PRODUCT, ORDER, CHAT_MESSAGE] }
    ReportReason: { type: string, enum: [FAKE_PRODUCT, DESCRIPTION_MISMATCH, SPAM, ABNORMAL_PRICE, HARASSMENT, VIOLATION] }
