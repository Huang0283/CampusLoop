        campusLocation: { type: string, minLength: 1, maxLength: 100 }
        scheduledDate: { type: string, format: date }
        timeSlotStart: { type: string, format: time }
        timeSlotEnd: { type: string, format: time }
        note: { type: string, maxLength: 500 }
    Order:
      type: object
      required: [id, product, buyer, seller, status, amount, buyerConfirmedComplete, sellerConfirmedComplete, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
