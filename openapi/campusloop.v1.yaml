    MessageListResponse: { allOf: [{ $ref: '#/components/schemas/ApiEnvelope' }, { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Message' } } } }] }
    OrderListResponse:
      allOf:
