components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-campusloop-session
      description: Production HttpOnly/Secure/SameSite=Strict/Path=/ host-only opaque session cookie. Local HTTP uses configured campusloop-session. Origin and CSRF header are also mandatory.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. Replays return the original successful result.
      schema: { type: string, format: uuid }
    UserId: { name: userId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    WantedId: { name: wantedId, in: path, required: true, schema: { type: integer, format: int64 } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
    OfferId: { name: offerId, in: path, required: true, schema: { type: integer, format: int64 } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: integer, format: int64 } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: integer, format: int64 } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    Unauthorized:
      description: Missing, expired, revoked, or invalid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: AUTH_UNAUTHORIZED, message: Authentication required, details: null, requestId: req_01 }
    Forbidden:
      description: Authenticated but not allowed for this role, object, field, or state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FORBIDDEN, message: Operation is not allowed, details: null, requestId: req_01 }
    NotFound:
      description: Resource does not exist or is intentionally hidden from this caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: Resource not found, details: null, requestId: req_01 }
    Conflict:
      description: Duplicate request, stale version, expired object, or illegal state transition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: STATE_CONFLICT, message: Resource state has changed, details: { refresh: true }, requestId: req_01 }
    ValidationError:
      description: Request fields failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: VALIDATION_ERROR, message: Invalid request, details: { field: amount }, requestId: req_01 }
    DependencyUnavailable:
      description: AI dependency unavailable; response identifies the allowed fallback.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: AI_UNAVAILABLE, message: Intelligent service unavailable, details: { fallback: keyword }, requestId: req_01 }
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: [object, 'null'], additionalProperties: true }
        requestId: { type: string }
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Role: { type: string, enum: [USER, ADMIN] }
    UserBrief:
      type: object
      additionalProperties: false
      required: [id, nickname, avatar, rating, transactionCount]
      properties:
        id: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        nickname: { type: string }
        avatar: { type: [string, 'null'], format: uri }
        rating: { type: number, minimum: 0, maximum: 5 }
        transactionCount: { type: integer, minimum: 0 }
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, avatar, rating, transactionCount, role, status, email, campusVerified, bio, school, college, major, tradeCount, creditLevel]
      properties:
        id: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        nickname: { type: string }
        avatar: { type: [string, 'null'], format: uri }
        rating: { type: number, minimum: 0, maximum: 5 }
        transactionCount: { type: integer, minimum: 0 }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        email: { type: string, format: email }
        campusVerified: { type: boolean, description: Teaching simulation only, not real university verification. }
        bio: { type: [string, 'null'], maxLength: 500 }
        school: { type: [string, 'null'], maxLength: 80 }
        college: { type: [string, 'null'], maxLength: 80 }
        major: { type: [string, 'null'], maxLength: 80 }
        tradeCount: { type: integer, minimum: 0, description: Compatibility alias equal to transactionCount. }
        creditLevel: { type: [string, 'null'], description: Null until an approved credit mapping exists. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 128 }
        nickname: { type: string, minLength: 1, maxLength: 40 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        avatar: { type: [string, 'null'], format: uri, maxLength: 512 }
        bio: { type: [string, 'null'], maxLength: 500 }
        school: { type: [string, 'null'], maxLength: 80 }
        college: { type: [string, 'null'], maxLength: 80 }
        major: { type: [string, 'null'], maxLength: 80 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, minimum: 1, maximum: 900, description: Access token lifetime in seconds. }
    AuthResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/UserProfile' }
    BrowserAuthResult:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: {type: string}
        expiresIn: {type: integer, minimum: 1, maximum: 900}
        user: {$ref: '#/components/schemas/UserProfile'}
    ProductStatus: { type: string, enum: [ON_SALE, RESERVED, SOLD, HIDDEN] }
    Product:
      type: object
      required: [id, seller, title, category, condition, price, status, images, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        seller: { $ref: '#/components/schemas/UserBrief' }
        title: { type: string }
        category: { type: string }
        condition: { type: string }
        description: { type: string }
        originalPrice: { type: number, minimum: 0 }
        price: { type: number, minimum: 0 }
        campusLocation: { type: string }
        images: { type: array, maxItems: 5, items: { type: string, format: uri } }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductWriteRequest:
      type: object
      required: [title, category, condition, price, campusLocation, images]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, enum: [BOOKS, DIGITAL, DAILY, SPORTS, clothing, other] }
        condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR] }
        description: { type: string, maxLength: 3000 }
        originalPrice: { type: [number, 'null'], minimum: 0 }
        price: { type: number, minimum: 0 }
        campusLocation: { type: string }
        images: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: uri } }
    WantedStatus: { type: string, enum: [OPEN, MATCHED, CLOSED, EXPIRED] }
    Wanted:
      type: object
      required: [id, owner, title, budgetMin, budgetMax, condition, location, status, expireAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        owner: { $ref: '#/components/schemas/UserBrief' }
        title: { type: string }
        description: { type: string }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        condition: { type: string }
        location: { type: string }
        status: { $ref: '#/components/schemas/WantedStatus' }
        expireAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    WantedWriteRequest:
      type: object
      required: [title, budgetMin, budgetMax, condition, location, expireAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 3000 }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        condition: { type: string }
        location: { type: string }
        expireAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [items, mode, degraded, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        mode: { type: string, enum: [keyword, hybrid, semantic] }
        degraded: { type: boolean }
        degradationReason: { type: string }
        resultVersion: { type: string }
        pagination: { $ref: '#/components/schemas/Pagination' }
    MatchResult:
      type: object
      required: [product, relevanceScore, reasons, resultVersion, expiresAt]
      properties:
        product: { $ref: '#/components/schemas/Product' }
        relevanceScore: { type: number, minimum: 0, maximum: 1, description: Relevance only, not transaction probability. }
        reasons: { type: array, items: { type: string } }
        constraints: { type: array, items: { type: string } }
        resultVersion: { type: string }
        expiresAt: { type: string, format: date-time }
    TrustSummary:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [AVAILABLE, NEW_USER_NEUTRAL, UNAVAILABLE] }
        score: { type: number, minimum: 1, maximum: 5 }
        validEventCount: { type: integer, minimum: 0 }
        ignoredEventCount: { type: integer, minimum: 0 }
        smoothing: { type: object, properties: { priorScore: { type: number }, priorWeight: { type: integer } } }
        factors: { type: array, items: { type: object, additionalProperties: true } }
        algorithmVersion: { type: string }
        degraded: { type: boolean }
        degradationReason: { type: string }
        fallback: { type: string }
    RiskClues:
      type: object
      required: [status, enforcementExecuted]
      properties:
        status: { type: string, enum: [CLUES_FOUND, NO_RULE_CLUES, INSUFFICIENT_DATA, UNAVAILABLE] }
        enforcementExecuted: { type: boolean, enum: [false] }
        manualReviewRecommended: { type: boolean }
        recommendedAction: { type: string }
        missingInputs: { type: array, items: { type: string } }
        clues: { type: array, items: { type: object, additionalProperties: true } }
        algorithmVersion: { type: string }
        disclaimer: { type: string }
        degraded: { type: boolean }
        degradationReason: { type: string }
        fallback: { type: string }
        sourceWindowAsOf: { type: string, format: date-time }
    PriceAdviceRequest:
      type: object
      required: [category, condition]
      properties:
        category: { type: string }
        condition: { type: string }
        title: { type: string }
        description: { type: string }
        originalPrice: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 99999999.99 }
    PriceAdvice:
      type: object
      required: [lower, upper, currency, factors, method, disclaimer, resultVersion]
      properties:
        lower: { type: [number, 'null'], minimum: 0 }
        upper: { type: [number, 'null'], minimum: 0 }
        status: { type: string, enum: [AVAILABLE, INSUFFICIENT_DATA, UNAVAILABLE] }
        degradationReason: { type: string }
        currency: { type: string, enum: [CNY] }
        factors: { type: array, items: { type: string } }
        sampleSize: { type: integer, minimum: 0 }
        method: { type: string, enum: [rule, model, unavailable] }
        degraded: { type: boolean }
        disclaimer: { type: string }
        resultVersion: { type: string }
    ChatSessionType: { type: string, enum: [PRODUCT, WANTED] }
    MessageKind: { type: string, enum: [TEXT, IMAGE, OFFER, ORDER_EVENT, SYSTEM] }
    ChatSession:
      type: object
      required: [id, type, peer, unreadCount]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ChatSessionType' }
        peer: { $ref: '#/components/schemas/UserBrief' }
        product: { $ref: '#/components/schemas/Product' }
        wanted: { $ref: '#/components/schemas/Wanted' }
        lastMessage: { $ref: '#/components/schemas/Message' }
        unreadCount: { type: integer, minimum: 0 }
    Message:
      type: object
      required: [id, clientMsgId, sessionId, senderId, kind, createdAt]
      properties:
        id: { type: integer, format: int64 }
        clientMsgId: { type: string, format: uuid }
        sessionId: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/MessageKind' }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [clientMsgId, kind]
      properties:
        clientMsgId: { type: string, format: uuid }
        kind: { type: string, enum: [TEXT, IMAGE] }
        content: { type: string, maxLength: 4000 }
    CreateChatSessionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [productId]
          properties:
            productId: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [wantedId]
          properties:
            wantedId: { type: integer, format: int64, minimum: 1 }
    OfferStatus: { type: string, enum: [PENDING, ACCEPTED, REJECTED, COUNTERED, EXPIRED, CANCELLED] }
    Offer:
      type: object
      required: [id, sessionId, buyerId, sellerId, proposerId, productId, originalPrice, amount, status, expireAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        buyerId: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        proposerId: { type: integer, format: int64, description: Current quote author; counteroffers change this without swapping buyer and seller. }
        productId: { type: integer, format: int64 }
        originalPrice: { type: number, minimum: 0 }
        amount: { type: number, minimum: 0 }
        status: { $ref: '#/components/schemas/OfferStatus' }
        counteredByOfferId: { type: integer, format: int64 }
        expireAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    OrderStatus: { type: string, enum: [PENDING_CONFIRM, BOOKED, MEETUP_ARRANGED, COMPLETED, CANCELLED, DISPUTED] }
    Meetup:
      type: object
      required: [id, orderId, version, campusLocation, scheduledDate, timeSlotStart, timeSlotEnd, buyerConfirmed, sellerConfirmed, createdAt]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        version: { type: integer, minimum: 1 }
        campusLocation: { type: string }
        scheduledDate: { type: string, format: date }
        timeSlotStart: { type: string, format: time }
        timeSlotEnd: { type: string, format: time }
        note: { type: string }
        buyerConfirmed: { type: boolean }
        sellerConfirmed: { type: boolean }
        createdAt: { type: string, format: date-time }
    MeetupWriteRequest:
      type: object
      required: [campusLocation, scheduledDate, timeSlotStart, timeSlotEnd]
