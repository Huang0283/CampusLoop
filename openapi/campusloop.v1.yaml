              properties:
                items: { type: array, items: { $ref: '#/components/schemas/UserProfile' } }
                pagination: { $ref: '#/components/schemas/Pagination' }

x-campusloop-websocket:
  url: ws://localhost:8001/ws
  authentication: First frame AUTH with accessToken within 5 seconds; tokens in URL/query are forbidden. AUTH_OK precedes business frames. Origins are checked and every private delivery reauthorizes against PostgreSQL.
  implementationPhase: Phase 3
  events:
    outgoing: [PING, SEND_MESSAGE, MARK_READ, TYPING]
    incoming: [PONG, MESSAGE_ACK, MESSAGE_CREATED, READ_UPDATED, ORDER_UPDATED, NOTIFICATION_CREATED, KICK]
  correctnessRule: WebSocket provides low latency; HTTP history and afterId recovery provide completeness.
