        orderId: { type: integer, format: int64 }
        fromStatus: { $ref: '#/components/schemas/OrderStatus' }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        operatorId: { type: integer, format: int64 }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    ReviewWriteRequest:
      type: object
      required: [orderId, overall, descriptionAccuracy, communication, punctuality]
      properties:
        orderId: { type: integer, format: int64 }
        overall: { type: integer, minimum: 1, maximum: 5 }
        descriptionAccuracy: { type: integer, minimum: 1, maximum: 5 }
        communication: { type: integer, minimum: 1, maximum: 5 }
        punctuality: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
    Review:
