        meetup: { $ref: '#/components/schemas/Meetup' }
        buyerConfirmedComplete: { type: boolean }
        sellerConfirmedComplete: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderEvent:
      type: object
      required: [id, orderId, toStatus, description, createdAt]
      properties:
