openapi: 3.1.0
info:
  title: CampusLoop API
  version: 0.2.0-contract
  description: |
    Phase 2 contract baseline for the CampusLoop MVP. It is a consumer contract,
    not proof that the FastAPI implementation or persistence exists.

    Lifecycle: Phase 2 freezes this contract and generates the SDK; Phase 3
    implements and integrates the MVP operations; Phase 4 implements AI and
    moderation operations; Phase 5 freezes and verifies the final contract.
  x-campusloop-owner: M5/M6
  x-campusloop-consumers: [M2, M3, M4, M7, M8, M10]
servers:
  - url: http://localhost:8001
    description: Local FastAPI HTTP service
tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Market
  - name: Wanted
  - name: Intelligence
  - name: Chat
  - name: Transactions
  - name: Governance
  - name: Notifications
  - name: Admin
security:
  - bearerAuth: []
paths:
  /chat/messages/{messageId}/image:
    get:
      tags: [Chat]
      operationId: getChatMessageImage
      x-campusloop-phase: 3
      summary: Read a private chat image as a participant; bearer authentication required
      parameters:
        - name: messageId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Private image; no-store
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/reports/{reportId}/evidence/{imageIndex}:
    get:
      tags: [Admin]
      operationId: getReportEvidence
      x-campusloop-phase: 3
      summary: Audited private evidence read in a specific report context
      parameters:
        - {$ref: '#/components/parameters/ReportId'}
        - name: imageIndex
          in: path
          required: true
          schema: {type: integer, minimum: 0, maximum: 4}
      responses:
        '200':
          description: Private image; no-store
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and dependency status
      security: []
      x-campusloop-phase: BP2-06
      responses:
        '200':
          description: Service is alive; dependency values may still report degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness based on database and Redis availability
      security: []
      x-campusloop-phase: BP2-06
      responses:
        '200':
          description: Database and Redis are available. This does not check object storage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: A required database or Redis dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a campus user
      description: With trusted Origin and X-CampusLoop-Browser=1, returns BrowserAuthResult and sets an HttpOnly SameSite=Strict session cookie; otherwise returns a JSON token pair. Browser families do not issue JSON refresh tokens.
      parameters:
        - {name: X-CampusLoop-Browser, in: header, schema: {type: string, enum: ['1']}}
      security: []
      x-campusloop-phase: BP2-01/FE3-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with email and password
      description: Browser mode uses trusted Origin and X-CampusLoop-Browser=1; returns access token plus user and an HttpOnly session cookie. Other clients retain JSON refresh-token rotation.
      parameters:
        - {name: X-CampusLoop-Browser, in: header, schema: {type: string, enum: ['1']}}
      security: []
      x-campusloop-phase: BP2-01/FE3-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: Account disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      security: []
      x-campusloop-phase: BP2-01/FE3-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token pair rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/browser-session:
    post:
      tags: [Auth]
      operationId: restoreBrowserSession
      x-campusloop-phase: 3
      summary: Restore a browser session after page reload or renew an expired access token
      description: Requires HttpOnly cookie, exact allowed Origin, X-CampusLoop-Browser=1 and JSON. Issues only a short-lived access token and current private user; never exposes the cookie or extends the original absolute seven-day session lifetime. Rate limited to 30 renewals per family per minute.
      security: [{browserSession: []}]
      parameters:
        - {name: X-CampusLoop-Browser, in: header, required: true, schema: {type: string, enum: ['1']}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Restored; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BrowserAuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423':
          description: Account disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Session renewal rate exceeded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the active session
      description: Browser mode requires allowed Origin and X-CampusLoop-Browser=1, revokes the cookie-bound family and expires the HttpOnly cookie even if access token expired. Non-browser mode retains Bearer logout.
      security: [{bearerAuth: []}, {browserSession: []}]
      parameters:
        - {name: X-CampusLoop-Browser, in: header, schema: {type: string, enum: ['1']}}
      x-campusloop-phase: BP2-01/FE3-01
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      x-campusloop-phase: BP2-01/FE3-02
      responses:
        '200':
          description: Current private profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      x-campusloop-phase: BP2-01/FE3-02
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated private profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getPublicUser
      security: []
      x-campusloop-phase: BP2-01/FE3-02
      responses:
        '200':
          description: Public profile without private fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUserResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products:
    get:
      tags: [Market]
      operationId: listProducts
      security: []
      x-campusloop-phase: BP2-03/FE3-04
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
      responses:
        '200':
          description: Paginated products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
    post:
      tags: [Market]
      operationId: createProduct
      x-campusloop-phase: BP2-03/BP2-04/FE3-05
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWriteRequest' }
      responses:
        '201':
          description: Product created once for the idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/mine:
    get:
      tags: [Market]
      operationId: listMyProducts
      x-campusloop-phase: BP2-03/FE3-05
      description: Authenticated user's products, including hidden items; identity is derived from the token.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
      responses:
        '200':
          description: Current user's paginated products.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Market]
      operationId: getProduct
      security: []
      x-campusloop-phase: BP2-03/FE3-04
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Market]
      operationId: updateProduct
      x-campusloop-phase: BP2-03/BP2-04/FE3-05
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWriteRequest' }
      responses:
        '200':
          description: Owner-updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Market]
      operationId: deleteProduct
      x-campusloop-phase: BP2-03/BP2-04/FE3-05
      responses:
        '204': { description: Product logically deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}/status:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Market]
      operationId: updateProductStatus
      x-campusloop-phase: BP2-03/BP2-04/FE3-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ProductStatus' }
      responses:
        '200':
          description: Status transition accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /favorites:
    get:
      tags: [Market]
      operationId: listFavorites
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      x-campusloop-phase: BP2-03/FE3-04
      responses:
        '200':
          description: Current user's favorites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
  /favorites/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Market]
      operationId: addFavorite
      x-campusloop-phase: BP2-03/BP2-04/FE3-04
      responses:
        '204': { description: Favorite exists; repeated calls are idempotent. }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Market]
      operationId: removeFavorite
      x-campusloop-phase: BP2-03/BP2-04/FE3-04
      responses:
        '204': { description: Favorite absent; repeated calls are idempotent. }

  /uploads/images:
    post:
      tags: [Market]
      operationId: uploadImage
      x-campusloop-phase: BP2-03/FE3-05
      parameters:
        - { name: purpose, in: query, schema: { type: string, enum: [product, evidence, chat], default: product } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Image metadata; URL is later submitted with a product/report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '413':
          description: Image exceeds the configured limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: Unsupported image format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /wanted:
    get:
      tags: [Wanted]
      operationId: listWanted
      security: []
      x-campusloop-phase: BP2-03/FE3-06
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: query, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WantedStatus' } }
      responses:
        '200':
          description: Paginated wanted posts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WantedListResponse' }
    post:
      tags: [Wanted]
      operationId: createWanted
      x-campusloop-phase: BP2-03/BP2-04/FE3-06
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WantedWriteRequest' }
      responses:
        '201':
          description: Wanted post created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WantedResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /wanted/{wantedId}:
    parameters:
      - $ref: '#/components/parameters/WantedId'
    get:
      tags: [Wanted]
      operationId: getWanted
      security: []
      x-campusloop-phase: BP2-03/FE3-06
      responses:
        '200':
          description: Wanted detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WantedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Wanted]
      operationId: updateWanted
      x-campusloop-phase: BP2-03/BP2-04/FE3-06
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WantedWriteRequest' }
      responses:
        '200':
          description: Owner-updated wanted post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WantedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Wanted]
      operationId: closeWanted
      x-campusloop-phase: BP2-03/BP2-04/FE3-06
      responses:
        '204': { description: Wanted post closed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}/trust:
    get:
      tags: [Intelligence]
      operationId: getUserTrust
      security: []
      x-campusloop-phase: AI3-06/AI3-09
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Smoothed completed-review facts; new users are neutral, not untrustworthy.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TrustSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/users/{userId}/risk-clues:
    get:
      tags: [Intelligence]
      operationId: getUserRiskClues
      x-campusloop-phase: AI3-07/AI3-09
      description: Admin-only audited manual-review clues. Missing sources are explicit nulls, never zeros; never changes business state.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Explainable manual-review facts or explicit service unavailability.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RiskClues' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /search:
    get:
      tags: [Intelligence]
      operationId: searchProducts
      security: []
      x-campusloop-phase: AI2-01/AI4-01/FE4-04
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: mode, in: query, schema: { type: string, enum: [keyword, hybrid, semantic], default: keyword } }
        - { name: category, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc], default: relevance } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Search result with explicit mode/degradation metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /wanted/{wantedId}/matches:
    parameters:
      - $ref: '#/components/parameters/WantedId'
    get:
      tags: [Intelligence]
      operationId: listWantedMatches
      x-campusloop-phase: AI2-02/AI4-02/FE4-05
      responses:
        '200':
          description: Ranked candidates; score is relevance, never transaction probability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /price-advice:
    post:
      tags: [Intelligence]
      operationId: getPriceAdvice
      x-campusloop-phase: AI2-03/AI4-03/FE4-06
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceAdviceRequest' }
      responses:
        '200':
          description: Advisory range with factors, provenance, and disclaimer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceAdviceResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /chat/sessions:
    get:
      tags: [Chat]
      operationId: listChatSessions
      x-campusloop-phase: BP2-03/FE3-07
      responses:
        '200':
          description: Current user's sessions only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionListResponse' }
    post:
      tags: [Chat]
      operationId: createChatSession
      x-campusloop-phase: BP2-03/BP2-04/FE3-07
      description: |
        Create or reuse a session for one product or wanted post. The other party
        is derived from resource ownership, not a client-supplied identity.
        Contacting one's own resource is rejected. An existing identical context
        and participant pair returns that session rather than creating duplicates.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatSessionRequest' }
      responses:
        '200':
          description: Created or reused the same context session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: listMessages
      x-campusloop-phase: BP2-03/FE3-07/FE3-08
      parameters:
        - { name: afterId, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: beforeId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Ordered history or reconnect delta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Chat]
      operationId: sendMessage
      x-campusloop-phase: BP2-03/BP2-04/FE3-07/FE3-08
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Persisted before it is pushed; clientMsgId is idempotent per sender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /chat/sessions/{sessionId}/read:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: markSessionRead
