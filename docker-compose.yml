# CampusLoop 一键启动环境（BP2-09，M9 维护）
# 用法：
#   cp .env.example .env
#   docker compose up -d --build
#   curl http://localhost:8001/health
# 依赖：Docker Engine 24+ 与 Compose v2。
# 说明：api 服务启动时自动执行 alembic upgrade head + 种子幂等校验。
#
# 镜像策略：MinIO 与 mc 由仓库 Dockerfile.minio 从固定源码 tag 构建。
#   不把本机拉取失败推断为某日镜像仓库全网删除；仍需外部构建网络。
#     服务端 RELEASE.2025-10-15T17-29-55Z
#     客户端 RELEASE.2025-08-13T08-35-41Z
#   基础镜像（golang:1.24-alpine / alpine:3.22）与 Go 模块（goproxy.cn）均须可达。
#   V3 说明：minio/minio-init 不声明 image 名（本地构建镜像无法拉取，见各服务注释），
#   docker compose pull 只拉 db/redis，三个本地构建服务均显示 Skipped 属正常。
# 其余镜像维持固定 tag（禁止 latest）：
#   pgvector/pgvector:0.8.6-pg16 / redis:7.4-alpine
# 国内拉取超时的应急方案（改的是 Docker 守护进程，不用改本文件）：
#   /etc/docker/daemon.json 增加
#     {"registry-mirrors": ["https://docker.m.daocloud.io"]}
#   然后 systemctl restart docker，再执行 docker compose pull

name: campusloop

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: campusloop
      POSTGRES_PASSWORD: campusloop
      POSTGRES_DB: campusloop
    ports:
      - "${CAMPUSLOOP_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusloop -d campusloop"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${CAMPUSLOOP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  minio:
    # 源码自建（见文件头注释）：版本 = Dockerfile.minio 内固定的源码 tag。
    # 注意（V3 整改）：故意不写 image 名——本地构建的镜像在任何 registry
    # 都不存在，写了名字 docker compose pull 会尝试拉取并报错
    # （"不在白名单/repository does not exist"）。不写名字则与 api 服务
    # 一样被干净地 Skipped，compose 自动命名 campusloop-minio。
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${CAMPUSLOOP_STORAGE_PORT:-9000}:9000"   # S3 API
      - "${CAMPUSLOOP_STORAGE_CONSOLE_PORT:-9001}:9001"   # 管理控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # 一次性初始化：创建公共/私有双桶后退出（公共读策略只作用于 public 桶）
  # 与 minio 共用同一 Dockerfile.minio（内含 mc 客户端）；构建层全部命中
  # 缓存，实际只是多打一个本地标签，秒级完成。同样不写 image 名（理由见上）。
  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/campusloop-public &&
      mc mb --ignore-existing local/campusloop-private &&
      mc anonymous set download local/campusloop-public &&
      mc anonymous set none local/campusloop-private &&
      echo '[minio-init] buckets campusloop-public(public-read) + campusloop-private(private) ready'
      "

  # ---------- M7/M8 建议服务容器（BP4-07，M9 维护） ----------
  # phase-3 环回内嵌 -> phase-4 独立容器（worker 跨进程调用所需）。
  # 仅监听 compose 内网（不发布宿主端口）；BASELINE_RPC_TOKEN(>=32) 必需。
  # 实验开关：docker compose stop baseline 即关闭模型——worker 任务就地
  # 降级回退内嵌引擎（任务仍 DONE，matching_results.metadata 标记
  # degraded=true，见 phase-4 verification.md 实测），交易主链路不受影响。
  baseline:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 卷属主修复的标准模式（官方 postgres/redis 镜像同款）：容器以 root
    # 启动 -> chown 卷挂载点 -> runuser 立即降权，主进程仍以 appuser 运行。
    # 原因：named volume 的 copy-on-first-use 依赖"镜像内挂载点非空"，
    # 且在 Docker Desktop/WSL2 上行为不稳定；启动时显式 chown 兜底。
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown -R appuser:appuser /data
        # util-linux 的 runuser 在 slim 基础镜像通常存在；缺省回退到 su。
        if command -v runuser >/dev/null 2>&1; then
          exec runuser -u appuser -- python scripts/baseline_services.py
        else
          exec su -s /bin/sh appuser -c 'exec python scripts/baseline_services.py'
        fi
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      BASELINE_RPC_TOKEN: ${BASELINE_RPC_TOKEN:?Run python backend/scripts/init_local.py first}
      BASELINE_BIND_HOST: 0.0.0.0
      BASELINE_DATA_DIR: /data
      # 服务名解析自身端口；仅用作"该容器对外地址"的声明。
      M7_SERVICE_URL: http://baseline:8787
      M8_SERVICE_URL: http://baseline:8788
    volumes:
      - baseline-data:/data
    healthcheck:
      # 仅探测两个 RPC 端口可达（服务无公开健康端点，token 由调用方持有）。
      test: ["CMD", "python", "-c", "import socket;[socket.create_connection(('127.0.0.1',p),3).close() for p in (8787,8788)]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ---------- AI 任务 Worker（BP4-07/08，M9 维护） ----------
  # 独立进程消费 PostgreSQL 队列（matching_jobs，SKIP LOCKED 语义零改动）；
  # /healthz 提供独立健康检查（主循环心跳 + 队列深度 + 最近运行摘要）。
  # 依赖 api healthy：迁移由 api 容器统一执行（职责单一），迁移完成前
  # worker 的观测写入只会计数告警、不影响任务（observer 兜底设计）。
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/worker.py"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      BASELINE_RPC_TOKEN: ${BASELINE_RPC_TOKEN:?Run python backend/scripts/init_local.py first}
      BASELINE_SERVICES_ENABLED: "true"
      BASELINE_INPROCESS: "false"
      MATCHING_WORKER_INPROCESS: "true"
      MATCHING_NOTIFICATIONS_ENABLED: ${MATCHING_NOTIFICATIONS_ENABLED:-true}
      WORKER_ID: ${WORKER_ID:-}
      M7_SERVICE_URL: http://baseline:8787
      M8_SERVICE_URL: http://baseline:8788
      DATABASE_URL: postgresql+psycopg://campusloop:campusloop@db:5432/campusloop
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_BUCKET: campusloop-public
      MINIO_PRIVATE_BUCKET: campusloop-private
    ports:
      - "${CAMPUSLOOP_WORKER_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?Run python backend/scripts/init_local.py first}
      AUTH_SIGNING_KID: ${AUTH_SIGNING_KID:-primary}
      AUTH_REGISTRATION_DOMAINS: ${AUTH_REGISTRATION_DOMAINS:-example.com,example.invalid}
      BASELINE_RPC_TOKEN: ${BASELINE_RPC_TOKEN:?Run python backend/scripts/init_local.py first}
      BASELINE_SERVICES_ENABLED: ${BASELINE_SERVICES_ENABLED:-true}
      # BP4-07（M9）：phase-4 拓扑——API 不再内嵌 worker 与建议服务，
      # 两者分别由独立容器承担；API 仅作为建议服务的客户端。
      BASELINE_INPROCESS: "false"
      MATCHING_WORKER_INPROCESS: "false"
      M7_SERVICE_URL: http://baseline:8787
      M8_SERVICE_URL: http://baseline:8788
      MATCHING_NOTIFICATIONS_ENABLED: ${MATCHING_NOTIFICATIONS_ENABLED:-true}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-campusloop-session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # 容器网络内用服务名，不是 localhost
      DATABASE_URL: postgresql+psycopg://campusloop:campusloop@db:5432/campusloop
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_PUBLIC_BUCKET: campusloop-public
      MINIO_PRIVATE_BUCKET: campusloop-private
      S3_PUBLIC_BASE_URL: http://localhost:${CAMPUSLOOP_STORAGE_PORT:-9000}/campusloop-public
    ports:
      - "${CAMPUSLOOP_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      # BP5-09（M9）：统一日志轮转——单容器上限 30MB（10m × 3），防止
      # 长跑后 json 日志写爆宿主磁盘；docker inspect 可核验生效值。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  minio-data:
  # M7 建议服务快照存储（BP4-07，M9）：跨重启保留 snapshotVersion 语义。
  baseline-data:
