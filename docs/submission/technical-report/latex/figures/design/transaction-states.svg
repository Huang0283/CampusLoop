<text x="160" y="629" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#1E293B">(1) saveMeetup rejects edits with 409 ORDER_STATE_CONFLICT once either party confirms completion.  (2) Early orders where both parties are disabled escalate to DISPUTED.</text>
<text x="160" y="649" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#475569">(3) Cancellation restores Product.ON_SALE only if no other active/completed/disputed order exists, the listing is unblocked &amp; not hidden/deleted, and the seller is ACTIVE.</text>
